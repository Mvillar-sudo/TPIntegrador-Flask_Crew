{% extends 'gestion/base_admin.html' %}

{% block title %}Editar Servicio - Admin Panel{% endblock %}

{% block extra_styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h2 class="fs-3 fw-bold text-dark mb-2 font-lato">Editar Servicio #{{ servicio.id_servicio }}</h2>
                    <p class="text-muted mb-4">Modifica los parámetros del servicio seleccionado.</p>
                    
                    <hr class="mb-4">

                    <form action="{{ url_for('admin.actualizar_servicio_proceso', id_servicio=servicio.id_servicio) }}" method="POST">
                        
                        <div class="form-group mb-4">
                            <label for="nombre" class="form-label fw-semibold text-secondary">Nombre del Servicio *</label>
                            <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" 
                                   value="{{ servicio.nombre }}" required placeholder="Ej. Servicio de Catering Empresarial">
                        </div>

                        <div class="form-group mb-4">
                                <label for="activo" class="admin-form-label">Disponibilidad actual:</label>
                                <select id="activo" name="activo" class="form-control admin-form-input">
                                    <option value='True' {% if servicio.activo == 1 %}selected{% endif %}>Activo</option>
                                    <option value='False' {% if servicio.activo == 0 %}selected{% endif %}>Inactivo</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5">
                            <a href="{{ url_for('admin.ver_servicios') }}" class="btn-cancelar">Cancelar</a>
                            <button type="submit" name="'guardar"  class="btn-guardar" >Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
