{% extends 'gestion/base_admin.html' %}

{% block title %}Editar Servicio - Admin Panel{% endblock %}

{% block extra_styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h2 class="fs-3 fw-bold text-dark mb-2 font-lato">Editar Servicio #{{ servicio.id }}</h2>
                    <p class="text-muted mb-4">Modifica los parámetros del servicio seleccionado.</p>
                    
                    <hr class="mb-4">

                    <form action="{{ url_for('admin.actualizar_servicio_proceso', id_servicio=servicio.id) }}" method="POST">
                        
                        <div class="form-group mb-4">
                            <label for="nombre" class="form-label fw-semibold text-secondary">Nombre del Servicio *</label>
                            <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" 
                                   value="{{ servicio.nombre }}" required placeholder="Ej. Servicio de Catering Empresarial">
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label fw-semibold text-secondary d-block">Disponibilidad del Servicio</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="activo" name="activo" value="1" 
                                       {% if servicio.activo %} checked {% endif %} style="transform: scale(1.2); cursor: pointer;">
                                <label class="form-check-label text-dark ms-2" for="activo">
                                    Ofrecer este servicio activamente en el restaurante
                                </label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5">
                            <a href="{{ url_for('admin.ver_servicios') }}" class="btn-cancelar">Cancelar</a>
                            <button type="submit" name="'guardar"  class="btn-guardar" a href="{{ url_for('admin.ver_servicios') }}">Guardar Cambios</button></a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
