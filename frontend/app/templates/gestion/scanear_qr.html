{% extends 'gestion/base_admin.html' %}
{% block title %}Panel - Scanear QR{% endblock %}
{% block extra_styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<div class="admin-page-wrapper">
    <div class="gtco-container">
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-default btn-sm">← Volver al Dashboard</a>

        <div class="admin-table-container text-center" style="max-width: 500px; margin: 30px auto;">
            <h2 style="font-weight: 300; margin-bottom: 20px;">Escanear QR de Reserva</h2>
            
            <div id="reader" style="width: 100%; margin-bottom: 20px;"></div>

            <div id="resultado" style="display:none; margin-top: 20px; padding: 15px; border-radius: 5px;">
                <h4 id="resultado-mensaje"></h4>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });

    scanner.render(function(qrData) {
        scanner.clear();

        let id_reserva, qr_code;
        try {
            const data = JSON.parse(qrData);
            id_reserva = data.id_reserva;
            qr_code = data.qr_code;
        } catch (e) {
            const div = document.getElementById('resultado');
            div.style.display = 'block';
            div.style.backgroundColor = '#f2dede';
            div.style.color = '#a94442';
            document.getElementById('resultado-mensaje').textContent = '✗ QR inválido o mal formado';
            return;
        }

        window.location.href = `/admin/dashboard/validar-qr?id_reserva=${id_reserva}&qr_code=${qr_code}`;
    });
</script>
{% endblock %}
