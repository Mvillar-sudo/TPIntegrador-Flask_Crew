{% extends 'gestion/base_admin.html' %}
{% block title %}Panel - Resultado QR{% endblock %}
{% block extra_styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<div class="admin-page-wrapper">
    <div class="gtco-container">
        <div class="admin-table-container text-center" style="max-width: 500px; margin: 30px auto; padding: 30px;">
            
            {% if exito %}
                <span style="font-size: 60px; color: #3c763d;">
                    <i class="ti-check-box"></i>
                </span>
                <h2 style="font-weight: 300; color: #3c763d; margin-top: 20px;">Acceso Permitido</h2>
            {% else %}
                <span style="font-size: 60px; color: #a94442;">
                    <i class="ti-close"></i>
                </span>
                <h2 style="font-weight: 300; color: #a94442; margin-top: 20px;">Acceso Denegado</h2>
            {% endif %}

            <p style="font-size: 16px; margin-top: 10px;">{{ mensaje }}</p>

            <a href="{{ url_for('admin.scanear_qr') }}" class="btn btn-primary" style="margin-top: 20px;">
                Escanear otro QR
            </a>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-default" style="margin-top: 20px;">
                Volver al Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
