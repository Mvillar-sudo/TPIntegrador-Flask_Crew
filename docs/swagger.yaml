openapi: 3.0.3

info:
  title: API Flask Burger
  version: 3.0.0
  description: |
    API REST para la gestion de administradores, menu, servicios,
    reservas con QR, resenas y metricas del dashboard.

servers:
  - url: http://localhost:5000
    description: Backend local

tags:
  - name: Estado
    description: Estado general del backend
  - name: Auth
    description: Autenticacion y gestion de administradores
  - name: Menu Publico
    description: Consulta publica del menu
  - name: Admin Menu
    description: Administracion de platos del menu
  - name: Servicios
    description: Gestion de servicios del restaurante
  - name: Reservas
    description: Gestion de reservas, disponibilidad y QR
  - name: Resenas
    description: Gestion de resenas de clientes
  - name: Dashboard
    description: Metricas administrativas

paths:
  /:
    get:
      tags:
        - Estado
      summary: Consultar estado del backend
      security: []
      responses:
        "200":
          description: Backend disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: online
                  mensaje:
                    type: string
                    example: Backend de Burger funcionando correctamente en el puerto 5000

  /api/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesion
      description: Autentica un administrador activo y devuelve un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Datos faltantes o invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/register:
    post:
      tags:
        - Auth
      summary: Registrar administrador
      description: Crea un nuevo usuario administrador. Requiere token de administrador.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Datos faltantes o invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuario no autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error al registrar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/usuarios:
    get:
      tags:
        - Auth
      summary: Listar administradores
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de usuarios administradores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/usuarios/{id_usuario}:
    parameters:
      - $ref: "#/components/parameters/IdUsuario"
    get:
      tags:
        - Auth
      summary: Obtener administrador por ID
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags:
        - Auth
      summary: Actualizar administrador
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdateRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Auth
      summary: Eliminar administrador
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /menu:
    get:
      tags:
        - Menu Publico
      summary: Listar menu
      description: Devuelve los platos del menu disponibles en la base.
      security: []
      responses:
        "200":
          description: Lista de platos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plato"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/menu:
    get:
      tags:
        - Admin Menu
      summary: Listar platos para administracion
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista completa de platos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plato"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Admin Menu
      summary: Crear plato
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatoCreateRequest"
      responses:
        "201":
          description: Plato creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/menu/{id_plato}:
    parameters:
      - $ref: "#/components/parameters/IdPlato"
    get:
      tags:
        - Admin Menu
      summary: Obtener plato por ID
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Plato encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "400":
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plato no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Admin Menu
      summary: Actualizar plato
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatoUpdateRequest"
      responses:
        "200":
          description: Plato actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plato no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Admin Menu
      summary: Eliminar plato
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Plato eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plato no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/menu/{id_plato}/estado:
    parameters:
      - $ref: "#/components/parameters/IdPlato"
    patch:
      tags:
        - Admin Menu
      summary: Cambiar estado de un plato
      description: Activa o desactiva la visibilidad del plato.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Falta el campo estado o ID invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plato no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/servicios/:
    get:
      tags:
        - Servicios
      summary: Listar servicios
      security: []
      responses:
        "200":
          description: Lista de servicios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Servicio"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Servicios
      summary: Crear servicio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicioCreateRequest"
      responses:
        "201":
          description: Servicio creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/servicios/{id_servicio}:
    parameters:
      - $ref: "#/components/parameters/IdServicio"
    get:
      tags:
        - Servicios
      summary: Obtener servicio por ID
      security: []
      responses:
        "200":
          description: Servicio encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Servicio"
        "404":
          description: Servicio no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags:
        - Servicios
      summary: Actualizar servicio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicioUpdateRequest"
      responses:
        "200":
          description: Servicio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Servicio no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Servicios
      summary: Eliminar servicio
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Servicio eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Servicio no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/reservas/:
    get:
      tags:
        - Reservas
      summary: Listar reservas
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reserva"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Reservas
      summary: Crear reserva
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservaCreateRequest"
      responses:
        "201":
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: No hay disponibilidad o ya existe una reserva para ese horario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/reservas/{id_reserva}:
    parameters:
      - $ref: "#/components/parameters/IdReserva"
    get:
      tags:
        - Reservas
      summary: Obtener reserva por ID
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Reserva no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/reservas/cancelar/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token de cancelacion enviado al cliente.
    get:
      tags:
        - Reservas
      summary: Cancelar reserva por token
      security: []
      responses:
        "200":
          description: Reserva cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token invalido o reserva ya cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/reservas/validar-qr:
    post:
      tags:
        - Reservas
      summary: Validar reserva por QR
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidarQrRequest"
      responses:
        "200":
          description: QR valido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: QR invalido, reserva cancelada o ya validada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Reserva no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/reservas/disponibilidad:
    get:
      tags:
        - Reservas
      summary: Consultar disponibilidad
      security: []
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-06-24"
        - name: hora
          in: query
          required: true
          schema:
            type: string
            format: time
          example: "20:30:00"
      responses:
        "200":
          description: Disponibilidad de la franja horaria
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponibilidad:
                    type: boolean
                    example: true
                  reservas_actuales:
                    type: integer
                    example: 2
        "400":
          description: Error al consultar disponibilidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/resenas/:
    get:
      tags:
        - Resenas
      summary: Listar resenas
      security: []
      responses:
        "200":
          description: Lista de resenas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resena"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Resenas
      summary: Crear resena
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResenaCreateRequest"
      responses:
        "201":
          description: Resena creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/resenas/{id_resena}:
    parameters:
      - $ref: "#/components/parameters/IdResena"
    get:
      tags:
        - Resenas
      summary: Obtener resena por ID
      security: []
      responses:
        "200":
          description: Resena encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resena"
        "404":
          description: Resena no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Resenas
      summary: Eliminar resena
      description: Elimina una resena. Requiere token de administrador.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Resena eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Resena no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/dashboard/metricas:
    get:
      tags:
        - Dashboard
      summary: Obtener metricas del dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Metricas obtenidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetricasResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Enviar el token como "Authorization: Bearer <token>".'

  parameters:
    IdUsuario:
      name: id_usuario
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    IdPlato:
      name: id_plato
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    IdServicio:
      name: id_servicio
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    IdReserva:
      name: id_reserva
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    IdResena:
      name: id_resena
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    Unauthorized:
      description: Token ausente, invalido o expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Usuario no autorizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@mail.com
        password:
          type: string
          format: password
          example: admin123

    LoginResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: Login exitoso
        token:
          type: string
          description: Token JWT para endpoints protegidos
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        usuario:
          type: object
          properties:
            email:
              type: string
              format: email
              example: admin@mail.com

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        nombre:
          type: string
          example: Administrador
        email:
          type: string
          format: email
          example: nuevo@mail.com
        password:
          type: string
          format: password
          example: admin123

    Usuario:
      type: object
      properties:
        id_usuario:
          type: integer
          example: 1
        nombre:
          type: string
          example: Administrador
        email:
          type: string
          format: email
          example: admin@mail.com
        password:
          type: string
          description: Hash de la contrasena almacenada
          readOnly: true
        activo:
          type: boolean
          example: true
        fecha_creacion:
          type: string
          format: date-time
          example: "2026-06-24T14:30:00"

    UsuarioUpdateRequest:
      type: object
      properties:
        nombre:
          type: string
          example: Nuevo nombre
        email:
