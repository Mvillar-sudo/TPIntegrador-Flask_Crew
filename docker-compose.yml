version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tpintegrador_mysql
    restart: always
    environment:
      MYSQL_DATABASE: tpintegrador_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/data/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/data/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tpintegrador_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=tpintegrador_db
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - QR_FOLDER=api/static/qr
      - SCHEMA_SQL_PATH=data/schema.sql
      - JWT_SECRET=change-me-please
      - JWT_EXP_HORAS=8
      - RECAPTCHA_SECRET=change-me-please
      - RECAPTCHA_DISABLED=true
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tpintegrador_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FRONTEND_SECRET_KEY=contrasena
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  db_data:
